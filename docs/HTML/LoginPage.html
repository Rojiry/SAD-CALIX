<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CALIX Management System</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <main class="page-shell">
        <section class="left-panel">
            <img src="../Assets/Logo1.png" alt="CALIX Glass and Aluminum Fabrication">
            <p class="panel-title">Sign up</p>
            <h1>Welcome back!</h1>
            <p class="welcome-text">
                Sign in to access the CALIX Sales and Inventory Management System.
            </p>
        </section>

        <section class="right-panel">
            <form id="loginForm" class="login-form">
                <h2>Sign in</h2>
                <p class="subtext">Enter your account details to continue.</p>

                <label for="user">Username</label>
                <input id="user" type="text" placeholder="Enter username" required>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter password" required>
                <p id="loginError" class="error-message" role="alert" aria-live="polite"></p>

                <button type="submit">Sign in</button>
            </form>
        </section>
    </main>

    <script src="../Functions/login.js"></script>
</body>
</html>
